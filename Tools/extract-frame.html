<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extract frame</title>
<link rel="stylesheet" href="./tools.css">
</head>
<body>
<main>
  <p class="crumb"><a href="./index.html">← Tools</a></p>
  <p class="brand">Quantum Life University</p>
  <h1>Extract frame</h1>
  <p class="sub">Save a still picture from a YouTube video at the time you choose.</p>

  <div class="panel">
    <label for="video">Video ID or link</label>
    <input id="video" type="text" placeholder="e.g. dQw4w9WgXcQ or https://youtu.be/…" autocomplete="off">
    <div class="grid" style="gap:0.55rem; margin-top:0.55rem">
      <div>
        <label for="time">Time in the video</label>
        <input id="time" type="text" placeholder="e.g. 1:30" autocomplete="off">
      </div>
      <div>
        <label for="format">Picture type</label>
        <select id="format">
          <option value="jpg" selected>Photo (JPEG)</option>
          <option value="png">High detail (PNG)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button type="button" class="primary" id="go">Save frame</button>
      <span id="status" class="status"></span>
    </div>
    <img id="preview" class="preview" alt="Extracted frame preview">
  </div>
</main>
<script>
  const statusEl = document.getElementById("status");
  const preview = document.getElementById("preview");
  const go = document.getElementById("go");

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  async function run() {
    const video = document.getElementById("video").value.trim();
    const time = document.getElementById("time").value.trim();
    if (!video || !time) {
      setStatus("Enter a video ID/link and time.", "err");
      return;
    }
    go.disabled = true;
    setStatus("Saving frame…");
    preview.style.display = "none";
    try {
      const res = await fetch("/api/extract-frame", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          video,
          time,
          format: document.getElementById("format").value,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Failed");
      setStatus(data.message + " · ", "ok");
      const a = document.createElement("a");
      a.href = data.downloadUrl;
      a.className = "dl";
      a.textContent = "Download " + data.filename;
      a.download = data.filename;
      statusEl.appendChild(a);
      preview.src = data.downloadUrl + "?t=" + Date.now();
      preview.style.display = "block";
    } catch (e) {
      setStatus(e.message || String(e), "err");
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener("click", () => void run());
</script>
</body>
</html>
